<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="page_title">Страница не настроена</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #212529;
            text-align: center;
            padding: 1rem;
        }
        .container {
            padding: 2rem 2.5rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 540px;
            width: 100%;
            position: relative;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 1rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #495057;
            margin: 0.5rem 0;
        }
        .subdomain {
            font-weight: bold;
            color: #d63384;
            word-break: break-all;
        }
        .lang-switch {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 4px;
            background: #f1f3f5;
            padding: 4px;
            border-radius: 8px;
        }
        .lang-switch button {
            border: none;
            background: transparent;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: #495057;
            transition: background 0.2s, color 0.2s;
            font-family: inherit;
        }
        .lang-switch button:hover { background: #dee2e6; }
        .lang-switch button.active {
            background: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="en">EN</button>
        </div>

        <h1>🚧</h1>
        <p data-i18n="msg_nothing">
            Извините, на поддомене <span class="subdomain" id="hostname"></span> пока ничего нет.
        </p>
        <p data-i18n="msg_soon">Пожалуйста, вернитесь позже.</p>
    </div>

    <script>
        const translations = {
            ru: {
                page_title: "Страница не настроена",
                msg_nothing: 'Извините, на поддомене <span class="subdomain" id="hostname"></span> пока ничего нет.',
                msg_soon: "Пожалуйста, вернитесь позже."
            },
            en: {
                page_title: "Page not configured",
                msg_nothing: 'Sorry, there is nothing here yet on the subdomain <span class="subdomain" id="hostname"></span>.',
                msg_soon: "Please come back later."
            }
        };

        function detectLang() {
            const saved = localStorage.getItem("lang");
            if (saved && translations[saved]) return saved;
            const browserLang = (navigator.language || "ru").slice(0, 2).toLowerCase();
            return translations[browserLang] ? browserLang : "ru";
        }

        function applyLang(lang) {
            const dict = translations[lang] || translations.ru;

            document.title = dict.page_title;
            document.documentElement.lang = lang;

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key] !== undefined) {
                    el.innerHTML = dict[key];
                }
            });

            document.querySelectorAll(".lang-switch button").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });

            const hostEl = document.getElementById("hostname");
            if (hostEl) hostEl.textContent = window.location.hostname;

            localStorage.setItem("lang", lang);
        }

        document.querySelectorAll(".lang-switch button").forEach(btn => {
            btn.addEventListener("click", () => applyLang(btn.dataset.lang));
        });

        applyLang(detectLang());
    </script>
</body>
</html>
